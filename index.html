            <!-- Editor Area -->
            <div class="tool-editor-wrap">

                        <svg viewBox="64 64 896 896" focusable="false">
                            <path d="M408 442h480c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H408c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8zm-8 204c0 4.4 3.6 8 8 8h480c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8H408c-4.4 0-8 3.6-8 8v56zm504-486H120c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8zm0 632H120c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h784c4.4 0 8-3.6 8-8v-56c0-4.4-3.6-8-8-8zM142.4 642.1L298.7 519a8.84 8.84 0 000-13.9L142.4 381.9c-5.8-4.6-14.4-.5-14.4 6.9v246.3a8.9 8.9 0 0014.4 7z"></path>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script>
        // Mobile nav toggle
        document.querySelector('.site-nav__toggle').addEventListener('click', function (e) {
            e.stopPropagation();
            document.querySelector('.site-nav__links').classList.toggle('open');
        });

        document.addEventListener("DOMContentLoaded", function () {
            var editor = ace.edit("editor");
            editor.setTheme("ace/theme/monokai");
            editor.setShowPrintMargin(false);
            editor.getSession().setMode("ace/mode/assembly_x86");
            editor.setValue(
                "$TTL 3600\n@\tIN\tSOA\tns1.woodj.me. hostmaster.woodj.me. (\n\t\t2026050801\t; serial\n\t\t7200\t\t; refresh\n\t\t3600\t\t; retry\n\t\t1209600\t; expire\n\t\t3600\t\t; negative cache ttl\n)\n\n;; Nameservers\n@\tIN\tNS\tns1.woodj.me.\n@\tIN\tNS\tns2.woodj.me.\nns1\tIN\tA\t192.0.2.10\nns2\tIN\tA\t192.0.2.11\n\n;; Web\n@\tIN\tA\t192.0.2.20\n@\tIN\tAAAA\t2001:db8::20\nwww\tIN\tCNAME\t@\napi\tIN\tA\t192.0.2.21\n\n;; Mail\n@\tIN\tMX\t10 mail1.woodj.me.\n@\tIN\tMX\t20 mail2.woodj.me.\nmail1\tIN\tA\t192.0.2.30\nmail2\tIN\tA\t192.0.2.31\n\n;; Text and policy\n@\tIN\tTXT\t\"v=spf1 mx -all\"\n_dmarc\tIN\tTXT\t\"v=DMARC1; p=none; rua=mailto:dmarc@woodj.me\"\n@\tIN\tCAA\t0 issue \"letsencrypt.org\"\n\n;; Service discovery\n_sip._tcp\tIN\tSRV\t10 60 5060 sip.woodj.me.\nsip\tIN\tA\t192.0.2.40\n"
            );

            // Sidebar collapse toggle (desktop)
            var sidebar = document.getElementById("sidebar");
            document.getElementById("collapse").addEventListener("click", function () {
                var isVisible = sidebar.style.display !== "none";
                sidebar.style.display = isVisible ? "none" : "flex";
            });

            // Sync FQDN inputs between desktop and mobile
            var fqdnDesktop = document.getElementById("fqdn");
            var fqdnMobile = document.getElementById("fqdn-mobile");
            fqdnDesktop.addEventListener("input", function () { fqdnMobile.value = this.value; });
            fqdnMobile.addEventListener("input", function () { fqdnDesktop.value = this.value; });

            // Shared validate function
            var resultBar = document.getElementById("result-bar");
            var resultLabel = document.getElementById("result-label");
            var resultDetails = document.getElementById("result-details");

            function normalizeResult(result) {
                var normalized = result.trim();

                if (normalized.startsWith('"') && normalized.endsWith('"')) {
                    normalized = normalized.slice(1, -1);
                }

                return normalized
                    .replace(/\\n/g, "\n")
                    .replace(/\\t/g, "\t")
                    .replace(/\\"/g, '"')
                    .trim();
            }

            function showResult(state, label, details) {
                resultBar.className = "result-bar " + state;
                resultLabel.textContent = label;
                resultDetails.textContent = details || "";
            }

            async function doValidate() {
                var fqdn = fqdnDesktop.value || fqdnMobile.value;
                var zoneFile = editor.getValue();

                if (!fqdn) {
                    showResult("error", "Domain name required", "Please enter an FQDN before validating.");
                    return;
                }

                showResult("loading", "Validating zone", "Running named-checkzone against your zone file...");

                var formData = new URLSearchParams();
                formData.append("fqdn", fqdn);
                formData.append("zoneFile", zoneFile);

                try {
                    var response = await fetch("https://bind-api.jamiewood.io/validate", {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData.toString(),
                    });

                    if (!response.ok) {
                        throw new Error("Failed to connect to API server (HTTP " + response.status + ")");
                    }

                    var result = normalizeResult(await response.text());
                    var isOk = /\bok\b/i.test(result) || /loaded serial/i.test(result);
                    showResult(
                        isOk ? "success" : "error",
                        isOk ? "Zone validated successfully" : "Validation failed",
                        result
                    );
                } catch (error) {
                    showResult("error", "Validation failed", error.message);
                }
            }

            // Wire up both validate buttons
            document.getElementById("validate-btn").addEventListener("click", doValidate);
            document.getElementById("validate-btn-mobile").addEventListener("click", doValidate);
        });
    </script>
